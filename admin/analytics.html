<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytiikka | Valttikodit Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css?v=4152f429">
    <link rel="stylesheet" href="../assets/css/admin.css?v=1c1a0819">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>

<body class="admin-layout">

    <aside class="admin-sidebar" id="sidebar">
        <div class="admin-brand">Valttikodit Admin</div>
        <nav class="admin-nav">
            <a href="dashboard.html">Liidit<span id="unread-leads-badge" style="display:none; color:#ef4444; font-weight:600; margin-left:4px;"></span></a>
            <a href="projects.html">Kohteet</a>
            <a href="references.html">Referenssit</a>
            <a href="social.html">Some</a>
            <a href="pages.html">Sivut</a>
            <a href="users.html">Käyttäjät</a>
            <a href="analytics.html" class="active">Analytiikka</a>
        </nav>
        <div style="padding: 1rem; border-top: 1px solid var(--border);">
            <div id="sidebar-user-email"
                style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
                Ladataan...</div>
        </div>
    </aside>

    <main class="admin-main">
        <div class="an-head">
            <div>
                <h1 style="font-size: 1.875rem; margin-bottom: 0.25rem;">Analytiikka</h1>
                <p class="an-sub" id="an-period">Ladataan...</p>
            </div>
            <div class="an-filters">
                <div class="an-seg" id="an-range" role="group" aria-label="Aikaväli">
                    <button type="button" data-range="7">7 pv</button>
                    <button type="button" data-range="30" class="active">30 pv</button>
                    <button type="button" data-range="90">90 pv</button>
                    <button type="button" data-range="custom">Oma</button>
                </div>
                <div class="an-custom" id="an-custom" hidden>
                    <input type="date" id="an-from" class="form-input" aria-label="Alkaen">
                    <span>–</span>
                    <input type="date" id="an-to" class="form-input" aria-label="Päättyen">
                    <button type="button" class="btn btn-outline" id="an-apply">Näytä</button>
                </div>
            </div>
        </div>

        <div class="so-tabs" id="an-tabs" role="tablist">
            <button class="so-tab active" data-tab="overview" role="tab">Yleiskuva</button>
            <button class="so-tab" data-tab="web" role="tab">Verkkosivut</button>
            <button class="so-tab" data-tab="some" role="tab">Some</button>
        </div>

        <div id="an-notes"></div>
        <div id="an-view" aria-live="polite"><div class="an-sub">Ladataan...</div></div>
    </main>

    <div id="an-tip" class="an-tip" hidden></div>
    <script src="../assets/js/admin.js?v=60eaf7bf"></script>
    <script src="../assets/js/admin-analytics.js?v=b5bff3dd"></script>
</body>

</html>
