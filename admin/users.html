<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Käyttäjien Hallinta | Valttikodit Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>

<body class="admin-layout">

    <aside class="admin-sidebar" id="sidebar">
        <div class="admin-brand">Valttikodit Admin</div>
        <nav class="admin-nav">
            <a href="dashboard.html">Liidit<span id="unread-leads-badge" style="display:none; color:#ef4444; font-weight:600; margin-left:4px;"></span></a>
            <a href="projects.html">Kohteet</a>
            <a href="pages.html">Sivut</a>
            <a href="users.html" class="active">Käyttäjät</a>
            <a href="analytics.html">Analytiikka</a>
        </nav>
        <div style="padding: 1rem; border-top: 1px solid var(--border);">
            <div id="sidebar-user-email"
                style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
                Ladataan...</div>
        </div>
    </aside>

    <main class="admin-main">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.875rem; margin-bottom: 0;">Ylläpitäjät</h1>
                <button class="btn btn-primary" onclick="window.addUser()">
                    Kutsu Uusi Ylläpitäjä
                </button>
            </div>
        </div>

        <div class="admin-card" style="padding: 0; overflow-x: auto;">
            <table class="admin-table" id="users-table">
                <thead>
                    <tr>
                        <th>Sähköposti</th>
                        <th>Rooli</th>
                        <th>Lisätty</th>
                        <th style="text-align: right;">Toiminnot</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <tr><td colspan="4">Ladataan käyttäjiä...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- JS Tila -->
    <script src="../assets/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.valttiSupabase) {
                const { data } = await window.valttiSupabase.auth.getSession();
                if (data && data.session && data.session.user) {
                    const u = document.getElementById('sidebar-user-email');
                    if (u) u.textContent = data.session.user.email;
                }
            }
        });
    </script>
</body>

</html>
