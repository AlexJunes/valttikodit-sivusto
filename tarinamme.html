<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarinamme | Valttikodit</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Supabase JS needed for rendering public pages dynamically -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    
    <!-- AOS Animaatiot -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <div class="container header-inner" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="/" class="logo">Valttikodit</a>

            <button class="mobile-menu-btn" aria-label="Avaa valikko">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>

            <nav class="nav-links">
                <a href="/kohteet">Myytävät kohteet</a>
                <a href="/tarinamme" style="color: var(--primary); font-weight: 600;">Tarinamme</a>
                <a href="/yhteys">Ota yhteyttä</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container" style="padding: 4rem 1.5rem; max-width: 800px;" data-aos="fade-up">
            <h1 style="margin-bottom: 1rem;" data-cms="Tarinamme Otsikko"></h1>
            <p class="lead mb-8" data-cms="Tarinamme Ingressi">
            </p>

            <!-- Tähän tulee kuva jos se on asetettu adminissa! -->
            <img data-cms="Tarinan Kuva" src="" style="width: 100%; max-height: 500px; object-fit: cover; border-radius: 8px; margin-bottom: 2.5rem; display: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);">

            <div style="color: var(--text-muted); line-height: 1.8; font-size: 1.125rem;">
                <h2 style="color: var(--primary); margin-top: 1rem; font-size: 1.75rem;" data-cms="Ensimmäinen Otsikko"></h2>
                <p class="mb-4" data-cms="Ensimmäinen Teksti">
                </p>

                <h2 style="color: var(--primary); margin-top: 2.5rem; font-size: 1.75rem;" data-cms="Toinen Otsikko"></h2>
                <p class="mb-4" data-cms="Toinen Teksti">
                </p>

                <h2 style="color: var(--primary); margin-top: 2.5rem; font-size: 1.75rem;" data-cms="Kolmas Otsikko"></h2>
                <p data-cms="Kolmas Teksti">
                </p>
            </div>
        </div>

        <!-- 1. Arvot (Values) -->
        <section style="background-color: var(--card-bg); padding: 5rem 1.5rem; margin-top: 4rem;" data-aos="fade-up">
            <div class="container" style="max-width: 800px; text-align: center;">
                <h2 style="font-size: 2rem; margin-bottom: 2rem; color: var(--primary);" data-cms="Arvot Otsikko"></h2>
                <blockquote style="font-size: 1.5rem; font-style: italic; color: var(--text-color); margin-bottom: 2rem; line-height: 1.6;" data-cms="Arvot Lainaus">
                </blockquote>
                <div style="font-weight: 600; font-size: 1.125rem; color: var(--text-muted);" data-cms="Arvot Henkilö"></div>
            </div>
        </section>

        <!-- 2. Tiimi (Team) -->
        <section style="padding: 6rem 1.5rem;" data-aos="fade-up">
            <div class="container">
                <h2 style="font-size: 2.25rem; margin-bottom: 3rem; text-align: center;" data-cms="Tiimi Otsikko"></h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 2rem;">
                    <!-- Henkilö 1 -->
                    <div style="text-align: center;">
                        <img src="" data-cms="H1 Kuva" alt="Henkilökuva" style="width: 100%; aspect-ratio: 1; object-fit: cover; background: #eee; margin-bottom: 1rem; border-radius: 4px;">
                        <h3 style="font-size: 1.25rem; margin-bottom: 0.25rem;" data-cms="H1 Nimi"></h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem; white-space: pre-line; line-height: 1.6;" data-cms="H1 Titteli"></p>
                    </div>
                    <!-- Henkilö 2 -->
                    <div style="text-align: center;">
                        <img src="" data-cms="H2 Kuva" alt="Henkilökuva" style="width: 100%; aspect-ratio: 1; object-fit: cover; background: #eee; margin-bottom: 1rem; border-radius: 4px;">
                        <h3 style="font-size: 1.25rem; margin-bottom: 0.25rem;" data-cms="H2 Nimi"></h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem; white-space: pre-line; line-height: 1.6;" data-cms="H2 Titteli"></p>
                    </div>
                    <!-- Henkilö 3 -->
                    <div style="text-align: center;">
                        <img src="" data-cms="H3 Kuva" alt="Henkilökuva" style="width: 100%; aspect-ratio: 1; object-fit: cover; background: #eee; margin-bottom: 1rem; border-radius: 4px;">
                        <h3 style="font-size: 1.25rem; margin-bottom: 0.25rem;" data-cms="H3 Nimi"></h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem; white-space: pre-line; line-height: 1.6;" data-cms="H3 Titteli"></p>
                    </div>
                    <!-- Henkilö 4 -->
                    <div style="text-align: center;">
                        <img src="" data-cms="H4 Kuva" alt="Henkilökuva" style="width: 100%; aspect-ratio: 1; object-fit: cover; background: #eee; margin-bottom: 1rem; border-radius: 4px;">
                        <h3 style="font-size: 1.25rem; margin-bottom: 0.25rem;" data-cms="H4 Nimi"></h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem; white-space: pre-line; line-height: 1.6;" data-cms="H4 Titteli"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. Prosessi (Process Timeline) -->
        <section style="background-color: var(--card-bg); padding: 6rem 1.5rem;" data-aos="fade-up">
            <div class="container">
                <h2 style="font-size: 2.25rem; margin-bottom: 4rem; text-align: center;" data-cms="Prosessi Otsikko"></h2>
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2rem;">
                    <!-- Vaihe 1 -->
                    <div style="background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); position: relative; border-top: 4px solid var(--primary);">
                        <div style="position: absolute; top: -1.2rem; left: 1.5rem; background: var(--primary); color: white; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold;">1</div>
                        <h3 style="font-size: 1.125rem; margin-bottom: 1rem; color: var(--primary); text-transform: uppercase; min-height: 2.5rem; padding-top: 0.5rem;" data-cms="P1 Otsikko"></h3>
                        <div style="color: var(--text-muted); font-size: 0.875rem; line-height: 1.7;" data-cms="P1 Teksti" data-list="true"></div>
                    </div>
                    
                    <!-- Vaihe 2 -->
                    <div style="background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); position: relative; border-top: 4px solid var(--primary);">
                        <div style="position: absolute; top: -1.2rem; left: 1.5rem; background: var(--primary); color: white; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold;">2</div>
                        <h3 style="font-size: 1.125rem; margin-bottom: 1rem; color: var(--primary); text-transform: uppercase; min-height: 2.5rem; padding-top: 0.5rem;" data-cms="P2 Otsikko"></h3>
                        <div style="color: var(--text-muted); font-size: 0.875rem; line-height: 1.7;" data-cms="P2 Teksti" data-list="true"></div>
                    </div>

                    <!-- Vaihe 3 -->
                    <div style="background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); position: relative; border-top: 4px solid var(--primary);">
                        <div style="position: absolute; top: -1.2rem; left: 1.5rem; background: var(--primary); color: white; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold;">3</div>
                        <h3 style="font-size: 1.125rem; margin-bottom: 1rem; color: var(--primary); text-transform: uppercase; min-height: 2.5rem; padding-top: 0.5rem;" data-cms="P3 Otsikko"></h3>
                        <div style="color: var(--text-muted); font-size: 0.875rem; line-height: 1.7;" data-cms="P3 Teksti" data-list="true"></div>
                    </div>

                    <!-- Vaihe 4 -->
                    <div style="background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); position: relative; border-top: 4px solid var(--primary);">
                        <div style="position: absolute; top: -1.2rem; left: 1.5rem; background: var(--primary); color: white; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold;">4</div>
                        <h3 style="font-size: 1.125rem; margin-bottom: 1rem; color: var(--primary); text-transform: uppercase; min-height: 2.5rem; padding-top: 0.5rem;" data-cms="P4 Otsikko"></h3>
                        <div style="color: var(--text-muted); font-size: 0.875rem; line-height: 1.7;" data-cms="P4 Teksti" data-list="true"></div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="site-footer" style="margin-top: 0; background-color: #f7f5f0; border-top: none; padding-top: 5rem;">
        <div class="container">
            <div class="footer-grid">
                <div>
                    <strong style="display: block; margin-bottom: 1.5rem; font-size: 1.25rem;">Valttikodit Oy</strong>
                    <p class="text-muted" style="font-size: 0.875rem; line-height: 1.8;"><span data-global-cms="Alatunniste: Osoite"></span><br><span data-global-cms="Alatunniste: Postitoimipaikka"></span></p>
                    <p class="text-muted" style="font-size: 0.875rem; margin-top: 1rem; line-height: 1.8;"><a
                            href="" data-global-cms="Alatunniste: Sähköposti"></a><br><a
                            href="" data-global-cms="Alatunniste: Puhelinnumero"></a></p>
                </div>
                <div>
                    <strong style="display: block; margin-bottom: 1.5rem; font-size: 1.125rem;">Linkit</strong>
                    <ul style="font-size: 0.875rem; line-height: 2.5;">
                        <li><a href="/kohteet" class="text-muted">Myytävät kohteet</a></li>
                        <li><a href="/tarinamme" class="text-muted">Tarinamme</a></li>
                        <li><a href="/yhteys" class="text-muted">Ota yhteyttä</a></li>
                    </ul>
                </div>
                <div>
                    <strong style="display: block; margin-bottom: 1.5rem; font-size: 1.125rem;">Seuraa meitä</strong>
                    <ul style="font-size: 0.875rem; line-height: 2.5;">
                        <li><a href="#" class="text-muted" data-global-cms="Alatunniste: Instagram-linkki" data-icon-only="false">Instagram</a></li>
                        <li><a href="#" class="text-muted" data-global-cms="Alatunniste: Facebook-linkki" data-icon-only="false">Facebook</a></li>
                        <li><a href="#" class="text-muted" data-global-cms="Alatunniste: LinkedIn-linkki" data-icon-only="false">LinkedIn</a></li>
                    </ul>
                </div>
            </div>
            <div
                style="border-top: 1px solid rgba(0,0,0,0.1); padding-top: 2rem; font-size: 0.875rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 2rem;">
                <span>© 2026 Valttikodit Oy. Kaikki oikeudet pidätetään.</span>
                <a href="tietosuojaseloste.html" style="text-decoration: underline;">Tietosuojaseloste</a>
            </div>
        </div>
    </footer>

    <!-- Floating CTA -->
    <a href="/yhteys" style="position: fixed; bottom: 2rem; right: 2rem; background-color: var(--primary); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" aria-label="Ota yhteyttä">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </a>

    <!-- JS muutettu ei-moduuliksi (CORS-korjaus) -->
    <script src="assets/js/main.js" defer></script>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            AOS.init({
                once: true,
                offset: 50,
                duration: 800,
                easing: 'ease-out-cubic'
            });
        });
    </script>
</body>
</html>
